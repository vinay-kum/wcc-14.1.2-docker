# Oracle WebCenter Content 14.1.2 + Oracle AI Database 26ai Free
# Local playground via docker-compose.
#
# This compose uses Oracle's BUNDLED bootstrap scripts inside the WCC image
# (/u01/oracle/container-scripts/*). The image is self-bootstrapping:
#   - wcc-admin's default CMD runs createDomainandStartAdmin.sh which:
#       1. runs RCU against the DB to create FMW schemas
#       2. runs WLST (createWCContentDomain_PS4.py) to build the domain
#       3. starts NodeManager + AdminServer
#   - wcc-content runs configureOrStartWebCenterContent.sh which starts
#       UCM_server1 and IBR_server1 against the shared domain volume.
#
# Read docs/03-quickstart.md before running. You must:
#   1. docker login container-registry.oracle.com (Auth Token, not SSO password)
#   2. Accept license at container-registry.oracle.com for `database/free`
#      AND `middleware/webcenter-content`
#   3. cp .env.example .env  and review (defaults are fine for a playground)
#
# Flow on `docker compose up`:
#   db (healthy) -> wcc-admin (creates domain + starts AdminServer)
#                -> wcc-content (starts UCM + IBR managed servers)

name: wcc14

x-wcc-common: &wcc-common
  image: ${WCC_IMAGE}
  build:
    context: ./image
    dockerfile: Dockerfile.wcc
    args:
      WCC_BASE_IMAGE: ${WCC_BASE_IMAGE}
  # WCC images are linux/amd64 only. On Apple Silicon this runs under emulation.
  platform: ${WCC_PLATFORM:-linux/amd64}
  networks:
    - wccnet
  # Oracle's image bakes a HEALTHCHECK that uses a buggy URL template — override
  # with explicit per-service checks below.

services:
  # ---------------------------------------------------------------------------
  # Oracle AI Database 26ai Free
  # ---------------------------------------------------------------------------
  db:
    image: ${DB_IMAGE}
    container_name: wcc14-db
    restart: unless-stopped
    environment:
      ORACLE_PWD: ${DB_PASSWORD}
      ORACLE_CHARACTERSET: AL32UTF8
    ports:
      - "${DB_PORT}:1521"
    volumes:
      - oradata:/opt/oracle/oradata
    networks:
      - wccnet
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/checkDBStatus.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 180s

  # ---------------------------------------------------------------------------
  # WCC AdminServer — creates the domain on first start.
  # Default CMD = /u01/oracle/container-scripts/createDomainandStartAdmin.sh
  # ---------------------------------------------------------------------------
  wcc-admin:
    <<: *wcc-common
    container_name: wcc14-admin
    hostname: wcc-admin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT}:7001"
    volumes:
      # /u01/oracle/user_projects is Oracle's documented VOLUME_DIR — the domain
      # and container-data both live under it. Shared with wcc-content.
      - wcc-userprojects:/u01/oracle/user_projects
    environment:
      DB_CONNECTION_STRING: ${DB_CONNECTION_STRING}
      DB_RCUPREFIX: ${DB_RCUPREFIX}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA_PASSWORD: ${DB_SCHEMA_PASSWORD}
      DB_DROP_AND_CREATE: ${DB_DROP_AND_CREATE:-false}
      ADMIN_SERVER_CONTAINER_NAME: wcc-admin
      ADMIN_PORT: ${ADMIN_PORT}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DOMAIN_NAME: ${DOMAIN_NAME}
      UCM_PORT: ${UCM_PORT}
      IBR_PORT: ${IBR_PORT}
      UCM_INTRADOC_PORT: ${UCM_INTRADOC_PORT}
      IBR_INTRADOC_PORT: ${IBR_INTRADOC_PORT}
      KEEP_CONTAINER_ALIVE: "true"
      # `component` selects extension domains. Empty = base WCC (UCM + IBR) only.
      # Set to e.g. "IPM,CAPTURE,ADFUI" to extend.
      component: ""
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7001/weblogic/ready || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 60
      start_period: 600s

  # ---------------------------------------------------------------------------
  # WCC Content — runs UCM_server1 + IBR_server1 in one container.
  # Uses Oracle's configureOrStartWebCenterContent.sh.
  # Shares the domain volume created by wcc-admin.
  # ---------------------------------------------------------------------------
  wcc-content:
    <<: *wcc-common
    container_name: wcc14-content
    hostname: wcc-content
    restart: unless-stopped
    depends_on:
      wcc-admin:
        condition: service_healthy
    ports:
      - "${UCM_PORT}:16200"
      - "${IBR_PORT}:16250"
      - "${UCM_INTRADOC_PORT}:4444"
      - "${IBR_INTRADOC_PORT}:5555"
    volumes:
      - wcc-userprojects:/u01/oracle/user_projects
    environment:
      ADMIN_SERVER_CONTAINER_NAME: wcc-admin
      ADMIN_PORT: ${ADMIN_PORT}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DOMAIN_NAME: ${DOMAIN_NAME}
      UCM_PORT: ${UCM_PORT}
      IBR_PORT: ${IBR_PORT}
      UCM_HOST_PORT: ${UCM_PORT}
      IBR_HOST_PORT: ${IBR_PORT}
      UCM_INTRADOC_PORT: ${UCM_INTRADOC_PORT}
      IBR_INTRADOC_PORT: ${IBR_INTRADOC_PORT}
      KEEP_CONTAINER_ALIVE: "true"
    # Wait for AdminServer to be stable for ~60s before kicking off content bootstrap.
    # Oracle's createDomainandStartAdmin.sh restarts AdminServer after setTopology.py,
    # which races with our stop/start cycle in configureOrStartWebCenterContent.sh
    # (Oracle's stopManagedServer.sh prints "stopped successfully" even when the
    # WLST connect to admin fails — leaving UCM running but the script thinking it's
    # stopped, then the next "start" hits an fcntl lock conflict on the persistent
    # store). 60 consecutive readiness checks 1s apart confirm admin is past its
    # post-setTopology restart window.
    command:
      - /bin/bash
      - -c
      - |
        echo "Waiting for wcc-admin to be stable (60 consecutive readiness checks)..."
        ok=0
        while [ $$ok -lt 60 ]; do
          if curl -sf -m 2 http://wcc-admin:7001/weblogic/ready >/dev/null 2>&1; then
            ok=$$((ok+1))
          else
            [ $$ok -gt 0 ] && echo "  (admin blip detected, restarting stability counter)"
            ok=0
          fi
          sleep 1
        done
        echo "AdminServer stable. Starting WCC content bootstrap..."
        exec /u01/oracle/container-scripts/configureOrStartWebCenterContent.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:16200/weblogic/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 60
      start_period: 900s

volumes:
  oradata:
  wcc-userprojects:

networks:
  wccnet:
    driver: bridge
